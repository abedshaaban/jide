name: Jide
options:
  bundleIdPrefix: com.abedshaaban
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Personal team ID. Set it in Local.xcconfig (git-ignored), see README.
    CODE_SIGN_STYLE: Automatic
targets:
  Jide:
    type: application
    platform: iOS
    scheme:
      testTargets:
        - JideTests
        - JideUITests
    configFiles:
      Debug: Local.xcconfig
      Release: Local.xcconfig
    sources:
      - path: Jide
      - path: ../shared/data/words.json
        buildPhase: resources
      - path: ../shared/data/characters.json
        buildPhase: resources
    settings:
      base:
        # Keep this stable: changing it makes iOS treat the app as new and its data is lost.
        PRODUCT_BUNDLE_IDENTIFIER: com.abedshaaban.jide
        PRODUCT_NAME: Jide
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 记得
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Record your own pronunciation to compare tones with the reference audio.
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES

  JideTests:
    type: bundle.unit-test
    platform: iOS
    configFiles:
      Debug: Local.xcconfig
      Release: Local.xcconfig
    sources:
      - path: JideTests
    dependencies:
      - target: Jide
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.abedshaaban.jide.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Jide.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Jide"
        BUNDLE_LOADER: "$(TEST_HOST)"

  JideUITests:
    type: bundle.ui-testing
    platform: iOS
    configFiles:
      Debug: Local.xcconfig
      Release: Local.xcconfig
    sources:
      - path: JideUITests
    dependencies:
      - target: Jide
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.abedshaaban.jide.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Jide
